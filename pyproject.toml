[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-sentinel"
version = "1.0.0"
description = "Proving drift detection fails: comprehensive analysis of ML monitoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ML Sentinel Team", email = "sentinel@example.com"}
]
keywords = [
    "machine-learning",
    "monitoring",
    "drift-detection",
    "model-degradation",
    "ml-ops",
    "data-drift",
    "concept-drift"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
    "pre-commit>=2.15.0",
]
experiments = [
    "folktables>=0.0.11",
    "wilds>=2.0.0",
    "torch>=1.9.0",
    "transformers>=4.10.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/ml-sentinel"
Documentation = "https://github.com/YOUR_USERNAME/ml-sentinel#readme"
Repository = "https://github.com/YOUR_USERNAME/ml-sentinel.git"
"Bug Tracker" = "https://github.com/YOUR_USERNAME/ml-sentinel/issues"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
