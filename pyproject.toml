[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-sentinel"
version = "1.1.0"
description = "Label-free monitoring of model accuracy under distribution shift: input drift vs confidence-based estimates (ATC)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Krish Garg"}
]
keywords = [
    "machine-learning",
    "monitoring",
    "drift-detection",
    "model-degradation",
    "ml-ops",
    "data-drift",
    "concept-drift"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
]
experiments = [
    "folktables>=0.0.12",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/krishdef7/ml-sentinel"
Documentation = "https://github.com/krishdef7/ml-sentinel#readme"
Repository = "https://github.com/krishdef7/ml-sentinel.git"
"Bug Tracker" = "https://github.com/krishdef7/ml-sentinel/issues"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
